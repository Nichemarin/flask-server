{% extends "base.html" %}

{% block title %}filtrar{% endblock %}

{% block content %}
<form action="{{ url_for('filtrar_data') }}" method="get">
    <p>Filtrar por precio:</p>

    <p>
        <label for="precioMin">Precio minimo:</label>
        <input type="number" name="precio_min" id="precioMin" step="10">
    </p>

    <p>
        <label for="precioMax">Precio Maximo:</label>
        <input type="number" name="precio_max" id="precioMax" step="10">
    </p>

    <p>
        <input type="submit" value="Filtrar">
    </p>
</form>
{% endblock %}
